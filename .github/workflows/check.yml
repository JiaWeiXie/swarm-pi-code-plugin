name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise and project tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.6.3
          cache: true

      - name: Install Linux sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap socat ripgrep

      - name: Check plugin version consistency
        run: npm run version:check

      - name: Install locked dependencies
        run: npm ci

      - name: Check documentation impact
        id: docs-impact
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
            head="$HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$CURRENT_SHA"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git hash-object -t tree /dev/null)"
            fi
          fi
          set +e
          npm run --silent docs:check:ci -- --base "$base" --head "$head" --format json > "$RUNNER_TEMP/docs-impact.json"
          status=$?
          cat "$RUNNER_TEMP/docs-impact.json"
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/docs-impact.json","utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `result=${r.result}\nscreenshots_required=${r.screenshotsRequired}\n`);'
          exit "$status"

      - name: Generate documentation screenshot smoke set
        if: steps.docs-impact.outputs.screenshots_required == 'true'
        run: |
          npm run docs:screenshots:install:ci
          npm run docs:screenshots -- --output "$RUNNER_TEMP/doc-screenshots"
          npm run docs:screenshots:validate -- --directory "$RUNNER_TEMP/doc-screenshots"

      - name: Enforce documentation impact on pull requests
        if: github.event_name == 'pull_request' && steps.docs-impact.outputs.result == 'fail'
        run: |
          echo "Documentation impact obligations are missing. See the JSON report above."
          exit 1

      - name: Install Configuration UI browser
        run: npm run docs:screenshots:install:ci

      - name: Run quality checks
        run: mise run check

      - name: Build source and plugin runtime
        run: mise run build

      - name: Reject generated runtime drift
        run: |
          git diff --exit-code -- plugins/swarm-pi-code-plugin/runtime
          test -z "$(git ls-files --others --exclude-standard -- plugins/swarm-pi-code-plugin/runtime)"

  live-sandbox:
    name: live sandbox (${{ matrix.os }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Makes the live OS-sandbox tests mandatory: a missing sandbox fails the job.
      SWARM_PI_REQUIRE_LIVE_SANDBOX: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and project tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.6.3
          cache: true

      - name: Install Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap socat ripgrep

      - name: Allow unprivileged user namespaces on this disposable runner
        if: runner.os == 'Linux'
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --unshare-user --unshare-pid -- /bin/true

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build tests
        run: npm run test:build

      - name: Run live sandbox tests
        run: |
          node -p 'process.platform + " " + process.arch'
          node --test .test-dist/tests/sandbox-runner.test.js .test-dist/tests/sandbox-dns.test.js
        env:
          SWARM_PI_CODE_PLUGIN_USER_STATE_DIR: ${{ runner.temp }}/swarm-pi-state
