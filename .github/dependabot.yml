version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # The root manifest and plugins/swarm-pi-code-plugin/package.json pin these three packages
    # separately, and version:check does not compare them. Dependabot watches only the root
    # manifest, so a bump here would leave the shipped plugin runtime on the old pin. Remove
    # these entries once the two manifests are unified.
    ignore:
      - dependency-name: "@anthropic-ai/sandbox-runtime"
      - dependency-name: "@earendil-works/pi-ai"
      - dependency-name: "@earendil-works/pi-coding-agent"
      # Keep @types/node on the major of the oldest supported runtime line. The packaged runtime
      # supports Node.js 22.19+ and development pins Node.js 24, so newer majors would type-check
      # APIs that the runtime may not have. Raise this deliberately with the Node.js baseline.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
